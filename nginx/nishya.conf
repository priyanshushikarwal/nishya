# ==============================================================================
# Nginx Reverse Proxy Configuration for Nishya on Hostinger VPS
# Place in: /etc/nginx/sites-available/nishya
# Symlink: ln -s /etc/nginx/sites-available/nishya /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name nishya.co.in www.nishya.co.in;

    # Redirect HTTP to HTTPS (Cloudflare also handles this with 'Always Use HTTPS')
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nishya.co.in www.nishya.co.in;

    # If using Cloudflare Origin CA Certificate (Recommended & Free):
    # ssl_certificate /etc/ssl/certs/cloudflare_origin.pem;
    # ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;

    # Or if using Certbot Let's Encrypt:
    # ssl_certificate /etc/letsencrypt/live/nishya.co.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nishya.co.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Real IP forwarded from Cloudflare
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
